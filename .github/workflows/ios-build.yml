name: iOS Build & Tests

on:
  # Nur von Hand (wie LeanGymLog E-030, 2026-10-28): gebaut wird am Mac, Actions nur auf Riccos Ansage.
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kompilieren, IPA erzeugen, Tests ausführen
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Neueste stabile Xcode-Version wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      # Sucht den neuesten verfügbaren iPhone-Simulator (iOS 17 oder neuer).
      # Die Namen ändern sich mit jeder Xcode-Version, daher nicht fest verdrahtet.
      - name: iPhone-Simulator auswählen
        id: sim
        run: |
          xcrun simctl list devices available --json > simulators.json
          UDID=$(python3 - <<'EOF'
          import json, re, sys
          data = json.load(open("simulators.json"))["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              if version < (17, 0):
                  continue
              for d in devices:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          if best is None:
              sys.exit("Kein iPhone-Simulator gefunden")
          print(best[1])
          EOF
          )
          echo "Gewählter Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # 1) Build für den Simulator inkl. Test-Target – prüft, ob alles kompiliert.
      - name: Build (iOS Simulator, inkl. Tests)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OPCalc.xcodeproj \
            -scheme OPCalc \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee simulator-build.log

      # 2) Unsignierte IPA für echte iPhones – zum Sideloaden mit Sideloadly.
      #    Läuft vor den Tests, damit du auch bei einem roten Test eine IPA bekommst.
      - name: Build (iPhone, unsigniert)
        run: |
          set -o pipefail
          xcodebuild \
            -project OPCalc.xcodeproj \
            -target OPCalc \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee device-build.log

      - name: IPA verpacken
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OPCalc.app Payload/
          zip -qry OPCalc.ipa Payload
          ls -lh OPCalc.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: OPCalc-ipa
          path: OPCalc.ipa
          retention-days: 14

      # 3) Unit-Tests im Simulator ausführen.
      - name: Unit-Tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OPCalc.xcodeproj \
            -scheme OPCalc \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      # Kompakte Übersicht in der Zusammenfassung des Laufs (immer, auch bei Erfolg).
      - name: Übersicht
        if: always()
        run: |
          {
            echo "## Ergebnis"
            echo ""
            if [ -f test.log ]; then
              echo "**Tests:** $(grep -E 'Executed [0-9]+ tests?' test.log | tail -n 1 | sed 's/^[[:space:]]*//' || true)"
              echo ""
            else
              echo "**Tests:** nicht ausgeführt (vorheriger Schritt fehlgeschlagen)"
              echo ""
            fi

            COMPILE_ERRORS=$(cat simulator-build.log device-build.log 2>/dev/null \
              | grep -E "(error|warning: .*will be an error):" \
              | sed "s|$PWD/||" \
              | sort -u \
              | head -n 80 || true)
            if [ -n "$COMPILE_ERRORS" ]; then
              echo "### Compiler-Fehler"
              echo ""
              echo '```'
              echo "$COMPILE_ERRORS"
              echo '```'
              echo ""
            fi

            if [ -f test.log ]; then
              TEST_FAILURES=$(grep -E "error: -\[|: error: |Test [Cc]ase .* failed" test.log \
                | sed "s|$PWD/||" \
                | sort -u \
                | head -n 80 || true)
              if [ -n "$TEST_FAILURES" ]; then
                echo "### Fehlgeschlagene Tests"
                echo ""
                echo '```'
                echo "$TEST_FAILURES"
                echo '```'
              else
                echo "Alle Tests bestanden ✅"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build-Logs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          retention-days: 7
